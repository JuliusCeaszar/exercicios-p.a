<script>
let numeros = [];

for (let i = 0; i < 10; i++) {
  numeros[i] = parseInt(prompt("Digite o " + (i + 1) + "º número inteiro:"));
}

for (let i = 0; i < 9; i++) {
  for (let j = 0; j < 9 - i; j++) {
    if (numeros[j] > numeros[j + 1]) {
      let auxiliar = numeros[j];
      numeros[j] = numeros[j + 1];
      numeros[j + 1] = auxiliar;
    }
  }
}

let resultado = "Números em ordem crescente: ";

for (let i = 0; i < 10; i++) {
  resultado += numeros[i] + " ";
}

alert(resultado);
</script>
