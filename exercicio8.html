<script>
let numeros = [];
let positivos = 0;
let negativos = 0;
let zeros = 0;

for (let i = 0; i < 10; i++) {
  numeros[i] = parseInt(prompt("Digite o " + (i + 1) + "º número inteiro:"));
}

for (let i = 0; i < 10; i++) {
  if (numeros[i] > 0) {
    positivos++;
  } else if (numeros[i] < 0) {
    negativos++;
  } else {
    zeros++;
  }
}

alert(
  "Números positivos: " + positivos +
  ". Números negativos: " + negativos +
  ". Zeros: " + zeros
);
</script>
